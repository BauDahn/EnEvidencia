[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enevidencia"
version = "0.1.0"
description = "Portal that compares what different sources claim about the same fact, without deciding what is true."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
enevidencia = "enevidencia.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enevidencia = ["web/templates/*.html", "reporting/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
