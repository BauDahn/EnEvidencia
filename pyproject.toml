[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enevidencia"
version = "0.1.0"
description = "Portal para comparar afirmaciones de distintas fuentes sin decidir cuál es la verdad."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
enevidencia = "enevidencia.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enevidencia = ["web/templates/*.html", "reporting/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
